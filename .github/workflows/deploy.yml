name: DevPulse CI/CD (Updated)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          cd devpulse-backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python Tests
        run: |
          cd devpulse-backend
          pip install -r requirements.txt && pytest --tb=short

  test-node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Tests
        run: cd server && npm run test:ci

  build-frontend:
    runs-on: ubuntu-latest
    needs: [test-node, test-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: devpulse-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd devpulse-frontend
          npm install

      - name: Build Frontend
        run: |
          cd devpulse-frontend
          npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-node, test-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./devpulse-backend
          push: false
          tags: devpulse-backend:latest
          load: true

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test-node, test-python, build-frontend, build-docker]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E Tests against Staging
        run: npx playwright test
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

      - name: Upload E2E Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [test-node, test-python, build-frontend, build-docker, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production server..."
          # Add your deployment commands here
          # e.g., scp, ssh, kubectl apply, etc.
